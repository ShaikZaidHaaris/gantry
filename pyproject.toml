[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-core"
version = "0.1.0.dev0"
description = "Plane-independent spine and contracts for robot data, policies, evaluation and feedback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Core is deliberately numpy-only. Anything heavier belongs in a plugin.
# tests/test_core_dependencies.py fails the build if this list grows.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-timeout>=2.2"]

[project.scripts]
gantry = "gantry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
# Twenty-odd plugins each test the thing they implement, so two of them naming
# a file test_declared.py is the normal case rather than a mistake. Under the
# default import mode that is a hard collection error, and the fix on offer —
# rename one of them — makes every plugin's test names depend on every other
# plugin's, which is the coupling this repo exists to avoid. importlib mode
# imports each file on its own path and the collision stops existing.

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
