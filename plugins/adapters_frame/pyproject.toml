[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-adapters-frame"
version = "0.1.0.dev0"
description = "Move pose channels between declared reference frames for Gantry"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core", "gantry-adapters-rotation", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "gantry-semantics-manipulation"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
