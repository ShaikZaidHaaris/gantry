[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-adapters-core"
version = "0.1.0.dev0"
description = "Unit conversion, resampling and dimension permutation adapters for Gantry"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
# adapters_rotation is a TEST dependency, not a runtime one: the suite proves
# euler action chunks close into quaternion targets, and the converter that
# closes them is registered by that plugin. In a shared venv the import was
# satisfied by accident; installed alone, ten tests failed on the gap.
dev = ["pytest>=7.4", "gantry-adapters-rotation"]

[project.entry-points."gantry.adapters"]
unit_convert = "gantry_adapters_core:UNIT_CONVERT"
resample = "gantry_adapters_core:RESAMPLE"
permute = "gantry_adapters_core:PERMUTE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
