[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-connector-robotwin"
version = "0.1.0.dev0"
description = "Read RoboTwin 2.0 demonstration files as Gantry episodes"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core", "gantry-evaluator-robotwin", "h5py>=3.9", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.connectors"]
robotwin = "gantry_connector_robotwin:RoboTwinDemos"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
