[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-scorer-machine"
version = "0.1.0.dev0"
description = "The world's own success predicate, as one judge among several"
requires-python = ">=3.10"
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.scorers"]
machine = "gantry_scorer_machine:MachinePredicate"

[tool.setuptools.packages.find]
where = ["src"]
