[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-tasks-declared"
version = "0.1.0.dev0"
description = "Reads tasks from files and refuses the ones nobody could score"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.tasks"]
declared = "gantry_tasks_declared:DeclaredTasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
