[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-evaluator-gym"
version = "0.1.0.dev0"
description = "Evaluates a policy against anything with reset() and step()"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# No environment library, here or in the tests. The caller passes a factory, so
# a suite with hard version pins never gets a say in what the framework installs.
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.evaluators"]
gym = "gantry_evaluator_gym:GymEvaluator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
