[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-feedback-core"
version = "0.1.0.dev0"
description = "Screen, funnel, attribution and hardening feedback modules for Gantry"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.feedback"]
screen = "gantry_feedback_core:Screen"
funnel = "gantry_feedback_core:Funnel"
attribution = "gantry_feedback_core:Attribution"
harden = "gantry_feedback_core:Harden"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
