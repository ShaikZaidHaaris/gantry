[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-adapters-rotation"
version = "0.1.0.dev0"
description = "Convert between rotation encodings for Gantry channels"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
# Tests exercise this plugin against others. Declared so it still
# works when installed on its own, which is how CI installs it.
dev = ["pytest>=7.4", "gantry-semantics-manipulation"]

[project.entry-points."gantry.adapters"]
rotation = "gantry_adapters_rotation:ROTATION"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
