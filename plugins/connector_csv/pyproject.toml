[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-connector-csv"
version = "0.1.0.dev0"
description = "Gantry connector for flat, long-format CSV trajectory files"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

# How the resolver will find this once discovery replaces the hardcoded
# registry. Declared now so the packaging is right from the first plugin.
[project.entry-points."gantry.connectors"]
csv = "gantry_connector_csv:CsvConnector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
