[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-curate-labels"
version = "0.1.0.dev0"
description = "Drop the demonstrations that failed, and the ones nobody scored"
requires-python = ">=3.10"
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.curators"]
labels = "gantry_curate_labels:FailedDemonstrations"

[tool.setuptools.packages.find]
where = ["src"]
