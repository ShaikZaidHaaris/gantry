[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-feedback-power"
version = "0.1.0.dev0"
description = "Refuse an experiment that cannot answer its question, before it is run"
requires-python = ">=3.10"
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.feedback"]
power = "gantry_feedback_power:PowerCheck"

[tool.setuptools.packages.find]
where = ["src"]
