[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-semantics-manipulation"
version = "0.1.0.dev0"
description = "Manipulation channel semantics for Gantry, aligned with the Inspect Robots action vocabulary"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
