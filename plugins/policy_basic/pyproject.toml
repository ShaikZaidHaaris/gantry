[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-policy-basic"
version = "0.1.0.dev0"
description = "Reference policies for Gantry: replay, constant and noisy-replay"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.entry-points."gantry.policies"]
replay = "gantry_policy_basic:ReplayPolicy"
constant = "gantry_policy_basic:ConstantPolicy"
noisy_replay = "gantry_policy_basic:NoisyReplayPolicy"
