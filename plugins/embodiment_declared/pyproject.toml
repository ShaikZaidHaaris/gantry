[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-embodiment-declared"
version = "0.1.0.dev0"
description = "Describes a robot from a file, or derives a first draft from its data"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.embodiments"]
declared = "gantry_embodiment_declared:from_file"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
