[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-evaluator-libero"
version = "0.1.0.dev0"
description = "Runs a policy over the LIBERO task suites"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# The simulator is not here. LIBERO brings robosuite, MuJoCo and a GL context;
# a laptop should still be able to install this plugin, read its descriptor and
# plan a run against its task list without any of that.
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
sim = ["libero", "robosuite"]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.evaluators"]
libero = "gantry_evaluator_libero:LiberoEvaluator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
