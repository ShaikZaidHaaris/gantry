[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-feedback-stillness"
version = "0.1.0.dev0"
description = "Parts of the action that never moved, and which of them were supposed to"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.feedback"]
stillness = "gantry_feedback_stillness:Stillness"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
