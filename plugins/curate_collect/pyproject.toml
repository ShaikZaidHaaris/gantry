[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-curate-collect"
version = "0.1.0.dev0"
description = "Turn the scenes a policy failed into an order for what to demonstrate next"
requires-python = ">=3.10"
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.curators"]
collect = "gantry_curate_collect:FromFailures"

[tool.setuptools.packages.find]
where = ["src"]
