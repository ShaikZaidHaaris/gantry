[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-feedback-verify"
version = "0.1.0.dev0"
description = "Test a curation plan against a retrain, and refuse to mark its own homework"
requires-python = ">=3.10"
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.feedback"]
verify = "gantry_feedback_verify:CurationVerifier"

[tool.setuptools.packages.find]
where = ["src"]
