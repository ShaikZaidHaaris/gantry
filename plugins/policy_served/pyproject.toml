[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-policy-served"
version = "0.1.0.dev0"
description = "Evaluates a policy that runs somewhere else, behind a URL"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# The default transport is the standard library on purpose: a client that drags
# in an HTTP stack can conflict with the very host it exists to bridge.
dependencies = ["gantry-core", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.policies"]
served = "gantry_policy_served:ServedPolicy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
