[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-connector-egoactions"
version = "0.1.0.dev0"
description = "Estimated hands as robot state and action, ready to write as a training set"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "gantry-core",
  "gantry-semantics-ego",
  "gantry-retargeter-hands",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.entry-points."gantry.connectors"]
egoactions = "gantry_connector_egoactions:EgoActionConnector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
